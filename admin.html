<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">

<title>પાર્થ ઓનલાઈન CSC — Admin</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,"Noto Sans Gujarati",sans-serif;
  background:#eef3f2;
  color:#17211f;
}

body{
  padding:0;
}

.wrap{
  max-width:900px;
  margin:auto;
  min-height:100dvh;
  background:#f8fbfa;
}

header{
  background:linear-gradient(135deg,#075e54,#128c7e);
  color:#fff;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:5;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.9;
}

main{
  padding:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 3px 15px #0000000c;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.row3{
  display:grid;
  grid-template-columns:90px 1fr 120px;
  gap:10px;
}

label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin:7px 0 5px;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #d5dedb;
  border-radius:10px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#e8f5f2;
  color:#075e54;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#075e54;
  color:#fff;
}

.danger{
  background:#ffe6e6;
  color:#a00000;
}

.muted{
  color:#66716e;
  font-size:12px;
}

.success{
  color:#087443;
  font-weight:700;
}

.error{
  color:#b00020;
  font-weight:700;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.item{
  border:1px solid #e0e7e5;
  border-radius:13px;
  padding:12px;
  margin:9px 0;
}

.itemhead{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.title{
  font-weight:800;
}

.badge{
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  background:#e6f6ef;
  color:#075e54;
}

.off{
  background:#eee;
  color:#777;
}

.hidden{
  display:none !important;
}

.login{
  max-width:430px;
  margin:50px auto;
  padding:16px;
}

.login .card{
  padding:20px;
}

.notice{
  background:#fff6d8;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#66716e;
}

@media(max-width:650px){

  .row,
  .row3{
    grid-template-columns:1fr;
  }

  .wrap{
    width:100%;
  }

}

</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>⚙️ પાર્થ ઓનલાઈન CSC — Admin Panel</h1>
  <p>Services • Price • Documents • Appointment</p>
</header>


<!-- ================= LOGIN ================= -->

<section id="loginScreen" class="login">

  <div class="card">

    <h2>Admin Login</h2>

    <div class="notice">
      Firebase Authentication માં Email/Password provider ચાલુ હોવો જરૂરી છે.
    </div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="username"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <div class="actions">
      <button id="loginBtn" class="primary">
        Login
      </button>
    </div>

    <p id="loginMsg" class="muted"></p>

  </div>

</section>


<!-- ================= ADMIN ================= -->

<main id="adminScreen" class="hidden">


  <!-- TOOLBAR -->

  <div class="card">

    <div class="toolbar">

      <div>
        <b>Service Manager</b>

        <div class="muted">
          Add, edit, hide/show, delete અને price બદલો.
        </div>
      </div>


      <div class="actions">

        <button id="addServiceBtn" class="primary">
          ➕ Add Service
        </button>

        <button id="defaultServicesBtn">
          ↻ Default Services
        </button>

        <button id="logoutBtn">
          Logout
        </button>

      </div>

    </div>

  </div>


  <!-- SERVICE EDITOR -->

  <div id="editor" class="card hidden">

    <h3 id="editorTitle">
      નવી Service
    </h3>

    <input
      type="hidden"
      id="serviceId"
    >


    <div class="row3">

      <div>

        <label>Icon</label>

        <input
          id="icon"
          placeholder="🪪"
        >

      </div>


      <div>

        <label>Service Name</label>

        <input
          id="name"
          placeholder="આધાર મોબાઈલ Update"
        >

      </div>


      <div>

        <label>Price (₹)</label>

        <input
          id="price"
          type="number"
          min="0"
          placeholder="100"
        >

      </div>

    </div>


    <div class="row">

      <div>

        <label>Description</label>

        <textarea
          id="description"
          placeholder="સેવા વિશે માહિતી..."
        ></textarea>

      </div>


      <div>

        <label>
          Documents — એક lineમાં એક
        </label>

        <textarea
          id="documents"
          placeholder="આધાર કાર્ડ Original&#10;નવો મોબાઈલ નંબર&#10;વ્યક્તિની હાજરી જરૂરી"
        ></textarea>

      </div>

    </div>


    <div class="row">

      <div>

        <label>Note</label>

        <input
          id="note"
          placeholder="અંતિમ જરૂરિયાત નિયમો મુજબ બદલાઈ શકે છે."
        >

      </div>


      <div>

        <label>Sort Order</label>

        <input
          id="sortOrder"
          type="number"
          value="10"
        >

      </div>

    </div>


    <div class="row">

      <label>

        <input
          id="active"
          type="checkbox"
          checked
        >

        Service દેખાડવી

      </label>


      <label>

        <input
          id="appointmentEnabled"
          type="checkbox"
          checked
        >

        Appointment ચાલુ

      </label>

    </div>


    <div class="actions">

      <button
        id="saveBtn"
        class="primary"
      >
        💾 Save
      </button>


      <button id="cancelBtn">
        Cancel
      </button>

    </div>


    <p id="saveMsg" class="muted"></p>

  </div>


  <!-- SERVICE LIST -->

  <div class="card">

    <div class="toolbar">

      <b>તમારી Services</b>

      <button id="refreshBtn">
        ↻ Refresh
      </button>

    </div>


    <div id="list">

      <div class="empty">
        Services loading...
      </div>

    </div>

  </div>


</main>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const FIREBASE_CONFIG = {

  apiKey:
    "AIzaSyCNOAY4KS6M1hNfwZtLM9txsCetcwKWS2Q",

  authDomain:
    "parth-csc-chat-ai.firebaseapp.com",

  projectId:
    "parth-csc-chat-ai",

  storageBucket:
    "parth-csc-chat-ai.firebasestorage.app",

  messagingSenderId:
    "986858320946",

  appId:
    "1:986858320946:web:d1171991af013e8e13b82b",

  measurementId:
    "G-HLC2GLQZ7N"

};



/* =========================================
   FIREBASE INIT
========================================= */

const app =
  initializeApp(FIREBASE_CONFIG);

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* =========================================
   DOM REFERENCES
========================================= */

const loginScreen =
  document.getElementById("loginScreen");

const adminScreen =
  document.getElementById("adminScreen");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const addServiceBtn =
  document.getElementById("addServiceBtn");

const defaultServicesBtn =
  document.getElementById("defaultServicesBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const editor =
  document.getElementById("editor");

const editorTitle =
  document.getElementById("editorTitle");

const serviceId =
  document.getElementById("serviceId");

const iconInput =
  document.getElementById("icon");

const nameInput =
  document.getElementById("name");

const priceInput =
  document.getElementById("price");

const descriptionInput =
  document.getElementById("description");

const documentsInput =
  document.getElementById("documents");

const noteInput =
  document.getElementById("note");

const sortOrderInput =
  document.getElementById("sortOrder");

const activeInput =
  document.getElementById("active");

const appointmentInput =
  document.getElementById("appointmentEnabled");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const saveMsg =
  document.getElementById("saveMsg");

const list =
  document.getElementById("list");



/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener("click", async () => {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  loginMsg.textContent = "";

  if (!email) {

    loginMsg.textContent =
      "Email નાખો.";

    return;
  }

  if (!password) {

    loginMsg.textContent =
      "Password નાખો.";

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "Login...";


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMsg.textContent =
      "Login successful ✓";

  }

  catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    loginMsg.textContent =
      "Login failed: " +
      (error.code || "") +
      " — " +
      (error.message || "");

  }

  finally {

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }

});



/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      loginScreen.classList.add(
        "hidden"
      );

      adminScreen.classList.remove(
        "hidden"
      );

      await loadServices();

    }

    else {

      loginScreen.classList.remove(
        "hidden"
      );

      adminScreen.classList.add(
        "hidden"
      );

    }

  }
);



/* =========================================
   NEW SERVICE
========================================= */

addServiceBtn.addEventListener(
  "click",
  () => {

    editor.classList.remove(
      "hidden"
    );

    editorTitle.textContent =
      "નવી Service";


    serviceId.value = "";

    iconInput.value =
      "📌";

    nameInput.value =
      "";

    priceInput.value =
      "";

    descriptionInput.value =
      "";

    documentsInput.value =
      "";

    noteInput.value =
      "";

    sortOrderInput.value =
      "10";

    activeInput.checked =
      true;

    appointmentInput.checked =
      true;

    saveMsg.textContent =
      "";

  }
);



/* =========================================
   CANCEL
========================================= */

cancelBtn.addEventListener(
  "click",
  () => {

    editor.classList.add(
      "hidden"
    );

    saveMsg.textContent =
      "";

  }
);



/* =========================================
   SAVE SERVICE
========================================= */

saveBtn.addEventListener(
  "click",
  saveService
);


async function saveService() {

  saveMsg.className =
    "muted";

  saveMsg.textContent =
    "";


  /* Check login */

  const user =
    auth.currentUser;


  if (!user) {

    saveMsg.className =
      "error";

    saveMsg.textContent =
      "Login session નથી. ફરી Login કરો.";

    return;

  }


  /* Service name */

  const serviceName =
    nameInput.value.trim();


  if (!serviceName) {

    saveMsg.className =
      "error";

    saveMsg.textContent =
      "Service Name જરૂરી છે.";

    nameInput.focus();

    return;

  }


  /* ID */

  let id =
    serviceId.value.trim();


  if (!id) {

    id =
      serviceName
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "_"
        )
        .replace(
          /^_+|_+$/g,
          ""
        );

    if (!id) {

      id =
        "service";

    }

    id +=
      "_" +
      Date.now();

  }


  /* Button state */

  const oldText =
    saveBtn.textContent;

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "Saving...";


  try {

    const serviceData = {

      icon:
        iconInput.value.trim() ||
        "📌",

      name:
        serviceName,

      price:
        Number(
          priceInput.value || 0
        ),

      description:
        descriptionInput.value.trim(),

      documents:
        documentsInput.value
          .split("\n")
          .map(
            x => x.trim()
          )
          .filter(
            Boolean
          ),

      note:
        noteInput.value.trim(),

      sortOrder:
        Number(
          sortOrderInput.value || 10
        ),

      active:
        activeInput.checked,

      appointmentEnabled:
        appointmentInput.checked,

      updatedAt:
        serverTimestamp()

    };


    console.log(
      "Saving service:",
      id,
      serviceData
    );


    await setDoc(
      doc(
        db,
        "services",
        id
      ),
      serviceData,
      {
        merge:true
      }
    );


    console.log(
      "SERVICE SAVED:",
      id
    );


    saveMsg.className =
      "success";

    saveMsg.textContent =
      "✅ Service Saved Successfully";


    await loadServices();


    setTimeout(
      () => {

        editor.classList.add(
          "hidden"
        );

        saveMsg.textContent =
          "";

      },
      700
    );


  }

  catch (error) {

    console.error(
      "FIRESTORE SAVE ERROR:",
      error
    );


    saveMsg.className =
      "error";


    saveMsg.textContent =
      "❌ Save failed: " +
      (error.code || "") +
      " — " +
      (error.message || "Unknown error");

  }


  finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      oldText;

  }

}



/* =========================================
   LOAD SERVICES
========================================= */

refreshBtn.addEventListener(
  "click",
  loadServices
);


async function loadServices() {

  list.innerHTML =
    '<div class="empty">Services loading...</div>';


  try {

    const q =
      query(
        collection(
          db,
          "services"
        ),
        orderBy(
          "sortOrder"
        )
      );


    const snap =
      await getDocs(q);


    list.innerHTML =
      "";


    if (snap.empty) {

      list.innerHTML =
        '<div class="empty">હજુ કોઈ Service નથી.</div>';

      return;

    }


    snap.forEach(
      (docSnap) => {

        const service = {

          id:
            docSnap.id,

          ...docSnap.data()

        };


        createServiceCard(
          service
        );

      }
    );

  }

  catch (error) {

    console.error(
      "LOAD SERVICES ERROR:",
      error
    );


    list.innerHTML =
      `
      <div class="notice">

        ❌ Services load થઈ નથી.

        <br><br>

        ${escapeHtml(
          error.code || ""
        )}

        <br>

        ${escapeHtml(
          error.message || ""
        )}

      </div>
      `;

  }

}



/* =========================================
   CREATE SERVICE CARD
========================================= */

function createServiceCard(
  service
) {

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "item";


  const head =
    document.createElement(
      "div"
    );

  head.className =
    "itemhead";


  const titleArea =
    document.createElement(
      "div"
    );


  const title =
    document.createElement(
      "span"
    );

  title.className =
    "title";

  title.textContent =
    `${service.icon || "📌"} ${service.name || ""}`;


  const badge =
    document.createElement(
      "span"
    );

  badge.className =
    "badge";


  if (
    service.active === false
  ) {

    badge.classList.add(
      "off"
    );

    badge.textContent =
      "Hidden";

  }

  else {

    badge.textContent =
      "Active";

  }


  titleArea.appendChild(
    title
  );

  titleArea.appendChild(
    document.createTextNode(
      " "
    )
  );

  titleArea.appendChild(
    badge
  );


  const price =
    document.createElement(
      "b"
    );

  price.textContent =
    `₹${service.price ?? 0}`;


  head.appendChild(
    titleArea
  );

  head.appendChild(
    price
  );


  const desc =
    document.createElement(
      "div"
    );

  desc.className =
    "muted";

  desc.textContent =
    service.description || "";


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  const editBtn =
    document.createElement(
      "button"
    );

  editBtn.textContent =
    "✏️ Edit";

  editBtn.addEventListener(
    "click",
    () => editService(service)
  );


  const toggleBtn =
    document.createElement(
      "button"
    );

  toggleBtn.textContent =
    service.active === false
      ? "👁️ Show"
      : "🙈 Hide";

  toggleBtn.addEventListener(
    "click",
    () => toggleService(service)
  );


  const deleteBtn =
    document.createElement(
      "button"
    );

  deleteBtn.className =
    "danger";

  deleteBtn.textContent =
    "🗑️ Delete";

  deleteBtn.addEventListener(
    "click",
    () => removeService(
      service.id
    )
  );


  actions.appendChild(
    editBtn
  );

  actions.appendChild(
    toggleBtn
  );

  actions.appendChild(
    deleteBtn
  );


  item.appendChild(
    head
  );

  item.appendChild(
    desc
  );

  item.appendChild(
    actions
  );


  list.appendChild(
    item
  );

}



/* =========================================
   EDIT SERVICE
========================================= */

function editService(
  service
) {

  editor.classList.remove(
    "hidden"
  );


  editorTitle.textContent =
    "Service Edit";


  serviceId.value =
    service.id || "";


  iconInput.value =
    service.icon || "📌";


  nameInput.value =
    service.name || "";


  priceInput.value =
    service.price ?? 0;


  descriptionInput.value =
    service.description || "";


  documentsInput.value =
    Array.isArray(
      service.documents
    )
      ? service.documents.join("\n")
      : "";


  noteInput.value =
    service.note || "";


  sortOrderInput.value =
    service.sortOrder ?? 10;


  activeInput.checked =
    service.active !== false;


  appointmentInput.checked =
    service.appointmentEnabled !== false;


  saveMsg.textContent =
    "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =========================================
   DELETE SERVICE
========================================= */

async function removeService(
  id
) {

  const ok =
    confirm(
      "આ service delete કરવી છે?"
    );


  if (!ok) {
    return;
  }


  try {

    awai
